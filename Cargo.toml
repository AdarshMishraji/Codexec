[workspace]
resolver = "2"
members = [
    "crates/codexec-common",
    "crates/codexec-exec-contract",
    "crates/codexec-exec-engine",
    "crates/codexec-api",
    "crates/codexec-worker",
    "crates/codexec-plugin-cli",
]

[workspace.package]
version = "0.1.0"
edition = "2021"

[workspace.dependencies]
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sqlx = { version = "0.8", features = ["runtime-tokio-rustls", "postgres", "uuid", "chrono", "macros", "migrate"] }
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
async-trait = "0.1"
dotenvy = "0.15"
anyhow = "1"
axum = "0.7"
tower-http = { version = "0.5", features = ["trace", "cors"] }
async-nats = "0.37"
clap = { version = "4", features = ["derive"] }
toml = "0.8"
sha2 = "0.10"
codexec-common = { path = "crates/codexec-common" }
codexec-exec-contract = { path = "crates/codexec-exec-contract" }
codexec-exec-engine = { path = "crates/codexec-exec-engine" }

# C - gcc 14, gnu11, -O2, AddressSanitizer, plus GLib 2.0 and uthash.
#
# compile_cmd uses `sh -c` for two reasons: (1) pkg-config must resolve
# GLib's multiarch include/lib paths at build time rather than us hardcoding
# a path, and (2) TMPDIR must be redirected to /sandbox/in (cwd) since gcc
# writes scratch files during compilation and the container rootfs is
# read-only with no /tmp tmpfs. Both verified live against codexec/c:1.0.0
# with `docker run --read-only` + PATH-only env, matching the real sandbox's
# process spec (see spec.rs) exactly: GQueue (GLib), HASH_ADD_INT/HASH_FIND
# (uthash.h, from Debian's uthash-dev package - upstream troydhanson/uthash
# has no tagged releases to pin against), and a gnu11 statement-expression
# all compiled and ran correctly.
#
# run_cmd sets ASAN_OPTIONS=detect_leaks=0: ASan bundles LeakSanitizer by
# default on Linux, which would fail otherwise-correct submissions that
# simply never free() everything before a short-lived process exits (normal
# and harmless for one-shot judge submissions, and confirmed to trigger in
# testing - a GQueue + two mallocs left unfreed by design were reported as
# "detected memory leaks" until this option was added). Out-of-bounds and
# use-after-free detection are untouched by this option.
[language]
slug = "c"
display_name = "C (GCC 14, gnu11)"
version = "14.2.0"

[image]
reference = "codexec/plugin-c:14"

[commands]
compile_cmd = ["sh", "-c", "TMPDIR=/sandbox/in gcc-14 -std=gnu11 -O2 -fsanitize=address -g $(pkg-config --cflags glib-2.0) -o main main.c $(pkg-config --libs glib-2.0)"]
run_cmd = ["sh", "-c", "ASAN_OPTIONS=detect_leaks=0 exec ./main"]
source_filename = "main.c"
compile_time_limit_ms = 10000

[limits]
default_cpu_time_limit_ms = 2000
default_cpu_limit_cores = 1.0
default_memory_limit_kb = 524288
max_cpu_time_limit_ms = 10000
max_cpu_limit_cores = 2.0
max_memory_limit_kb = 1048576

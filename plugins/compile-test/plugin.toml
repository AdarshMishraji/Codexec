# Exercises the compile-vs-run phase separation in the wrapper script
# without needing a real compiler toolchain image: compile_cmd always
# fails, so submissions should reliably land in compile_error, never
# reaching the run phase at all.
[language]
slug = "compile-test"
display_name = "Compile (test)"
version = "1.0.0"

[image]
reference = "docker.io/library/busybox:latest"

[commands]
compile_cmd = ["false"]
run_cmd = ["cat", "main.txt"]
source_filename = "main.txt"
compile_time_limit_ms = 5000

[limits]
default_cpu_time_limit_ms = 2000
default_cpu_limit_cores = 1.0
default_memory_limit_kb = 65536
max_cpu_time_limit_ms = 10000
max_cpu_limit_cores = 2.0
max_memory_limit_kb = 262144

# Deliberately hangs (busy-loop) so it reliably triggers time_limit_exceeded
# at a low cpu_time_limit_ms, without needing a "real" language.
[language]
slug = "spin-test"
display_name = "Spin (test)"
version = "1.0.0"

[image]
reference = "docker.io/library/busybox:latest"

[commands]
compile_cmd = []
run_cmd = ["sh", "main.sh"]
source_filename = "main.sh"
compile_time_limit_ms = 5000

[limits]
default_cpu_time_limit_ms = 2000
default_cpu_limit_cores = 1.0
default_memory_limit_kb = 65536
max_cpu_time_limit_ms = 10000
max_cpu_limit_cores = 2.0
max_memory_limit_kb = 262144

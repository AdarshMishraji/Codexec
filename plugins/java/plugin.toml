[language]
slug = "java"
display_name = "Java (OpenJDK 25)"
version = "25"

[image]
reference = "codexec/java:25"

[commands]
compile_cmd = ["javac", "-cp", "/opt/codexec/lib/pair.jar", "-d", ".", "Main.java"]
run_cmd = ["java", "-cp", "/opt/codexec/lib/pair.jar:.", "Main"]
source_filename = "Main.java"
compile_time_limit_ms = 10000

[limits]
default_cpu_time_limit_ms = 2000
default_cpu_limit_cores = 1.0
default_memory_limit_kb = 524288
max_cpu_time_limit_ms = 10000
max_cpu_limit_cores = 2.0
max_memory_limit_kb = 1048576

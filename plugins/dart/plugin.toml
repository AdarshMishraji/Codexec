[language]
slug = "dart"
display_name = "Dart 3.2"
version = "3.2.6"

[image]
reference = "codexec/dart:1.0.0"

[commands]
compile_cmd = []
run_cmd = ["dart", "--packages=/opt/dart-template/codexec_deps/.dart_tool/package_config.json", "main.dart"]
source_filename = "main.dart"
compile_time_limit_ms = 5000

[limits]
default_cpu_time_limit_ms = 2000
default_cpu_limit_cores = 1.0
default_memory_limit_kb = 524288
max_cpu_time_limit_ms = 10000
max_cpu_limit_cores = 2.0
max_memory_limit_kb = 1048576

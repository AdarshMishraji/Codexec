# Go - 1.23, with github.com/emirpasic/gods@v1.18.1 and
# github.com/emirpasic/gods/v2@v2.0.0-alpha usable from a single submitted
# main.go (no per-submission go.mod from the user).
#
# Unlike Rust's rustc-direct approach, Go's toolchain genuinely requires a
# module (go.mod) to resolve non-stdlib imports - there's no supported
# GOPATH-mode escape hatch in modern Go. So compile_cmd scaffolds one: it
# copies a fixed, pre-verified go.mod/go.sum (baked into the image at
# /opt/go-template, declaring both gods module paths - v1 and v2 coexist
# fine since they're distinct module paths) plus the submitted main.go into
# a scratch dir under /sandbox/in (the only writable path), then runs
# `go build` there with GOPROXY=off against the image's pre-warmed,
# offline module cache (GOMODCACHE=/opt/go/pkg/mod, populated by the
# Dockerfile's `go mod download`) - no network needed at submission time.
#
# Verified end-to-end against codexec/go:1.23 with `docker run --read-only`
# + PATH-only env (matching spec.rs exactly): a program importing both
# github.com/emirpasic/gods/stacks/arraystack (v1) and
# github.com/emirpasic/gods/v2/queues/arrayqueue (v2) compiled and ran
# correctly.
#
# Two env quirks found only by testing:
#   - TMPDIR must be redirected to /sandbox/in: `go build` creates its own
#     work dir under $TMPDIR (default /tmp), which fails with "read-only
#     file system" since the sandbox rootfs is read-only with no /tmp
#     tmpfs.
#   - `go` itself is NOT on the exec engine's hardcoded PATH by default -
#     the base golang:1.23 image only puts /usr/local/go/bin on PATH via
#     its own image ENV, which the sandbox's container spec does not
#     inherit (see spec.rs). The Dockerfile symlinks it into
#     /usr/local/bin to fix this.
[language]
slug = "go"
display_name = "Go"
version = "1.23"

[image]
reference = "codexec/plugin-go:1.23"

[commands]
compile_cmd = ["sh", "-c", "mkdir -p /sandbox/in/.gowork && cp /opt/go-template/go.mod /opt/go-template/go.sum /sandbox/in/.gowork/ && cp /sandbox/in/main.go /sandbox/in/.gowork/main.go && cd /sandbox/in/.gowork && TMPDIR=/sandbox/in GOFLAGS=-mod=mod GOPROXY=off GOCACHE=/sandbox/in/.gocache GOPATH=/sandbox/in/.gopath go build -o /sandbox/in/main ."]
run_cmd = ["./main"]
source_filename = "main.go"
compile_time_limit_ms = 10000

[limits]
default_cpu_time_limit_ms = 2000
default_cpu_limit_cores = 1.0
default_memory_limit_kb = 262144
max_cpu_time_limit_ms = 10000
max_cpu_limit_cores = 2.0
max_memory_limit_kb = 1048576

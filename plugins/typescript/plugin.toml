[language]
slug = "typescript"
display_name = "TypeScript 5.7.3 (Node.js 22.14.0)"
version = "5.7.3"

[image]
reference = "codexec/typescript:1.0.0"

[commands]
compile_cmd = ["sh", "-c", "ln -sfn /opt/codexec/node_modules /sandbox/in/node_modules && tsc --alwaysStrict --strictBindCallApply --strictFunctionTypes --target ES2024 --module commonjs --esModuleInterop main.ts"]
run_cmd = ["sh", "-c", "NODE_PATH=/opt/codexec/node_modules exec node --harmony main.js"]
source_filename = "main.ts"
compile_time_limit_ms = 10000

[limits]
default_cpu_time_limit_ms = 2000
default_cpu_limit_cores = 1.0
default_memory_limit_kb = 262144
max_cpu_time_limit_ms = 10000
max_cpu_limit_cores = 2.0
max_memory_limit_kb = 1048576

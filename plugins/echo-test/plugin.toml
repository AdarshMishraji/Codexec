# Trivial pipeline-testing plugin: no compiler, just echoes the submitted
# source back as stdout. Exercises validate -> insert -> publish -> claim
# -> execute -> write-back -> poll end to end with zero real toolchain.
[language]
slug = "echo-test"
display_name = "Echo (test)"
version = "1.0.0"

[image]
reference = "docker.io/library/busybox:latest"

[commands]
compile_cmd = []
run_cmd = ["cat", "main.txt"]
source_filename = "main.txt"
compile_time_limit_ms = 5000

[limits]
default_cpu_time_limit_ms = 2000
default_cpu_limit_cores = 1.0
default_memory_limit_kb = 65536
max_cpu_time_limit_ms = 10000
max_cpu_limit_cores = 2.0
max_memory_limit_kb = 262144

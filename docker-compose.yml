services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: codexec
      POSTGRES_PASSWORD: codexec
      POSTGRES_DB: codexec
    ports:
      - "5432:5432"
    volumes:
      - codexec-postgres-data:/var/lib/postgresql/data

  nats:
    image: nats:2.10
    command: ["-js"]
    ports:
      - "4222:4222"
      - "8222:8222"

  # Dev/test only: bundles runc + skopeo + umoci alongside codexec-worker
  # so the real sandboxed execution engine can be exercised without a
  # bare-metal Linux host. Needs `privileged` for runc to manage cgroups
  # and mount namespaces. See docker/worker.Dockerfile. No daemon runs
  # here - runc is a plain subprocess per submission.
  worker:
    build:
      context: .
      dockerfile: docker/worker.Dockerfile
    privileged: true
    depends_on:
      - postgres
      - nats
    environment:
      DATABASE_URL: postgres://codexec:codexec@postgres:5432/codexec
      NATS_URL: nats://nats:4222
      RUST_LOG: info
      IMAGE_CACHE_ROOT: /var/lib/codexec/images
      RUNC_ROOT: /run/codexec/runc
      WORKSPACE_ROOT: /var/lib/codexec/workspaces
      CGROUP_ROOT: /sys/fs/cgroup
      WORKER_CONCURRENCY: 4
      # Conservative defaults sized for a small dev VM (e.g. colima's
      # 2 CPU / 4GiB default profile) with headroom for the worker
      # process itself. Raise for a bigger host.
      ENGINE_TOTAL_CPU_CORES: "1.0"
      ENGINE_TOTAL_MEMORY_MB: "1024"
    volumes:
      - codexec-image-cache:/var/lib/codexec/images
      - codexec-workspaces:/var/lib/codexec/workspaces

volumes:
  codexec-postgres-data:
  codexec-image-cache:
  codexec-workspaces:
